
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PDF</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

  <!-- Flipbook StyleSheet -->
  <link href="lib/css/min.css" rel="stylesheet" type="text/css">
  <!-- Icons Stylesheet -->
  <link href="lib/css/themify-icons.min.css" rel="stylesheet" type="text/css">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Link to the original CSS file -->
  <link rel="stylesheet" href="lib/css/min.css">

</head>
<body>

  <div id="flipbookContainer">
  </div>

  <!-- jQuery  -->
  <script src="lib/js/libs/jquery.min.js" type="text/javascript"></script>
  <!-- PDF.js library -->
  <script src="lib/js/libs/pdf.min.js" type="text/javascript"></script>
  <!-- PDF.js worker -->
  <script src="lib/js/libs/pdf.worker.min.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->
  <script src="lib/js/flipbook.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->
  <script>
    jQuery(document).ready(function () {
      // Initialize the flipbook with our new class
      var pdf = './sample.pdf';
      var options = {
        height: 2000,
        duration: 700,
        backgroundColor: "#2F2D2F"
      };
      $('#flipbookContainer').flipBook(pdf, options);
    });
  </script>

</body>
</html>
